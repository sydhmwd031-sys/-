name: Build APK
on: [push, workflow_dispatch]
permissions: {"contents": "write"}
jobs: {"build": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.7"}}, {"name": "Build", "run": "gradle assembleDebug --no-daemon && cp app/build/outputs/apk/debug/app-debug.apk Hanoni.apk"}, {"uses": "actions/upload-artifact@v4", "with": {"name": "Hanoni-APK", "path": "Hanoni.apk"}}, {"uses": "softprops/action-gh-release@v2", "with": {"tag_name": "build-${{ github.run_number }}", "name": "Hanoni ${{ github.run_number }}", "files": "Hanoni.apk"}}]}}
