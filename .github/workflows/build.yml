name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk FajrAlarm.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FajrAlarm-apk
          path: FajrAlarm.apk
      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fajr-alarm-v${{ github.run_number }}
          name: منبه الفجر - إصدار ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: حمّل ملف FajrAlarm.apk وثبّته على جوالك.
          files: FajrAlarm.apk
